<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniSpark AI Studio</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div class="chat-container">
        <div id="chat-box" class="chat-box">
            <!-- Messages will appear here -->
        </div>

        <div class="input-container">
            <input type="text" id="user-input" placeholder="Ask OmniSpark anything or type a prompt...">
            <button id="mic-btn" title="Voice Input">🎤</button>
            <button id="send-btn" title="Send Message">↑</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');

        // Apni Gemini API key yahan dalein
        const API_KEY = "YOUR_GEMINI_API_KEY"; 

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // User message append karein
            appendMessage(text, 'user');
            userInput.value = '';

            const loadingId = appendMessage('Thinking...', 'ai');

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-pro:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiText = data.candidates[0].content.parts[0].text;
                    updateMessage(loadingId, aiText);
                } else {
                    updateMessage(loadingId, "API Error: Kuch galat ho gaya, dubara try karein.");
                }
            } catch (error) {
                updateMessage(loadingId, "Network Error: API connect nahi ho pa rahi hai.");
            }
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            messageDiv.innerText = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return messageDiv;
        }

        function updateMessage(element, text) {
            element.innerText = text;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Mic button basic speech recognition support
        micBtn.addEventListener('click', () => {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'en-US';
                recognition.start();

                recognition.onresult = (event) => {
                    userInput.value = event.results[0][0].transcript;
                };
            } else {
                alert("Speech recognition is not supported in this browser.");
            }
        });
    </script>
</body>
</html>
