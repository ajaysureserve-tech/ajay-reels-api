<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniSpark AI Studio - Free AI Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .bg-gradient-wallpaper {
            background: linear-gradient(135deg, #f0f4ff 0%, #ffffff 50%, #e0e7ff 100%);
        }
        .sidebar-hidden {
            transform: translateX(-100%);
        }
    </style>
</head>
<body class="bg-gradient-wallpaper text-slate-800 font-sans antialiased h-screen flex flex-col overflow-hidden relative">

    <!-- Top Navigation Bar -->
    <header class="h-16 flex items-center justify-between px-4 bg-transparent z-30 shrink-0">
        <div class="flex items-center space-x-3">
            <button onclick="toggleSidebar()" class="p-2.5 rounded-full hover:bg-slate-200/60 text-slate-700 transition" title="Toggle Menu">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="flex items-center space-x-2 font-bold text-slate-800 text-base md:text-lg tracking-tight">
                <i class="fa-solid fa-sparkles text-blue-600"></i>
                <span>OmniSpark</span>
                <span class="bg-blue-100 text-blue-700 text-[10px] font-semibold px-2 py-0.5 rounded-full">AI Powered</span>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <button onclick="startNewChat()" class="p-2.5 rounded-full hover:bg-slate-200/60 text-slate-700 transition" title="New Workspace">
                <i class="fa-solid fa-pen-to-square text-base"></i>
            </button>
            <div class="h-9 w-9 rounded-full overflow-hidden border border-slate-300 shadow-sm flex items-center justify-center bg-gradient-to-tr from-blue-600 to-indigo-600 text-white font-bold text-xs cursor-pointer" title="AI Account Active">
                OS
            </div>
        </div>
    </header>

    <!-- Main Container with Sliding Sidebar -->
    <div class="flex-1 flex relative overflow-hidden">
        
        <!-- Sidebar Drawer -->
        <aside id="sidebar" class="absolute inset-y-0 left-0 w-72 bg-white/95 backdrop-blur-xl border-r border-slate-200 shadow-2xl flex flex-col justify-between transition-transform duration-300 z-40 sidebar-hidden">
            <div>
                <div class="p-4 flex items-center justify-between border-b border-slate-100">
                    <span class="font-bold text-slate-800 text-sm">OmniSpark AI Suites</span>
                    <button onclick="toggleSidebar()" class="p-2 rounded-full hover:bg-slate-100 text-slate-500">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="p-3 space-y-1 overflow-y-auto max-h-[calc(100vh-130px)]">
                    <button onclick="selectModule('chat'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl bg-blue-50 text-blue-600 text-sm font-medium transition">
                        <i class="fa-solid fa-comments"></i>
                        <span>AI Assistant Chat</span>
                    </button>
                    <button onclick="selectModule('prompt'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-terminal text-purple-600"></i>
                        <span>Prompt Engineering</span>
                    </button>
                    <button onclick="selectModule('content'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-pen-nib text-indigo-600"></i>
                        <span>Content & Blog Creator</span>
                    </button>
                    <button onclick="selectModule('video'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-video text-pink-600"></i>
                        <span>Video & Reels Generator</span>
                    </button>
                    <button onclick="selectModule('marketing'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-bullhorn text-amber-600"></i>
                        <span>Marketing Automation</span>
                    </button>
                    <button onclick="selectModule('design'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-wand-magic-sparkles text-cyan-600"></i>
                        <span>Design & Creativity</span>
                    </button>
                    <button onclick="selectModule('data'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-chart-line text-emerald-600"></i>
                        <span>Data & Analytics</span>
                    </button>
                    <button onclick="selectModule('branding'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-user-shield text-violet-600"></i>
                        <span>Personal Branding</span>
                    </button>
                </div>
            </div>

            <div class="p-4 border-t border-slate-100 text-xs text-slate-400 flex items-center justify-between">
                <span>OmniSpark v3.0 Live AI</span>
                <i class="fa-solid fa-shield-halved text-emerald-500"></i>
            </div>
        </aside>

        <!-- Overlay -->
        <div id="sidebar-overlay" onclick="toggleSidebar()" class="absolute inset-0 bg-black/20 backdrop-blur-xs hidden z-30 transition-opacity"></div>

        <!-- Central Workspace Area -->
        <main class="flex-1 flex flex-col h-full relative overflow-y-auto px-4 pb-6 max-w-3xl mx-auto justify-between">
            
            <div id="view-chat" class="flex-1 flex flex-col justify-center items-center text-center space-y-4 my-auto">
                <div id="welcome-banner" class="space-y-2">
                    <h1 class="text-3xl md:text-5xl font-black text-slate-800 tracking-tight">
                        Hello, Creator
                    </h1>
                    <p class="text-slate-500 text-base md:text-lg">What intelligent content or solution can I generate for you today?</p>
                </div>
                
                <div id="chat-messages" class="w-full space-y-4 text-left overflow-y-auto max-h-[45vh] hidden pr-2">
                    <!-- Dynamic Messages -->
                </div>
            </div>

            <div id="view-module" class="w-full hidden my-auto py-4">
                <div id="module-container" class="bg-white/90 backdrop-blur-md p-6 rounded-3xl border border-slate-200/80 shadow-lg">
                    <!-- Module contents injected dynamically -->
                </div>
            </div>

            <!-- Bottom Prompt Bar -->
            <div class="w-full pt-4 shrink-0">
                <div class="bg-white/90 backdrop-blur-md rounded-full px-4 py-3 border border-slate-200 shadow-xl flex items-center space-x-3 focus-within:border-blue-500 transition-all">
                    <label class="cursor-pointer text-slate-400 hover:text-slate-600 p-1.5 transition" title="Add File">
                        <i class="fa-solid fa-plus text-lg"></i>
                        <input type="file" accept="image/*,video/*" class="hidden" onchange="handleFileUpload(event)">
                    </label>

                    <input type="text" id="main-input" class="w-full bg-transparent text-slate-800 placeholder-slate-400 focus:outline-none text-sm md:text-base" placeholder="Ask OmniSpark anything..." onkeydown="if(event.key === 'Enter') sendUserPrompt()">

                    <div class="flex items-center space-x-2 text-slate-400">
                        <button onclick="triggerMic()" class="hover:text-slate-600 p-1.5 transition" title="Voice Input">
                            <i class="fa-solid fa-microphone text-base"></i>
                        </button>
                        <button onclick="sendUserPrompt()" class="bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-full w-9 h-9 flex items-center justify-center transition shadow" title="Send Prompt">
                            <i class="fa-solid fa-arrow-up text-sm"></i>
                        </button>
                    </div>
                </div>
                <div id="status-alert" class="hidden text-center text-xs text-blue-600 mt-2 font-medium bg-blue-50/90 py-1 px-3 rounded-full inline-block mx-auto"></div>
                <p class="text-[11px] text-center text-slate-400 mt-2">OmniSpark connects to real AI models. Verify critical outputs.</p>
            </div>

        </main>
    </div>

    <!-- JavaScript Controller with Live Gemini API -->
    <script>
        // 🔑 APNI GEMINI API KEY YAHAN PASTE KAREIN:
        const API_KEY = "YOUR_GEMINI_API_KEY_HERE";
        let currentModule = 'chat';

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('sidebar-hidden');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }

        function startNewChat() {
            document.getElementById('welcome-banner').classList.remove('hidden');
            document.getElementById('chat-messages').classList.add('hidden');
            document.getElementById('chat-messages').innerHTML = '';
            document.getElementById('view-chat').classList.remove('hidden');
            document.getElementById('view-module').classList.add('hidden');
            currentModule = 'chat';
        }

        function selectModule(mod) {
            currentModule = mod;
            document.getElementById('welcome-banner').classList.add('hidden');
            document.getElementById('chat-messages').classList.add('hidden');
            document.getElementById('view-chat').classList.add('hidden');
            document.getElementById('view-module').classList.remove('hidden');

            const container = document.getElementById('module-container');

            if(mod === 'prompt') {
                container.innerHTML = `
                    <div class="flex items-center space-x-3 mb-3">
                        <div class="p-2.5 bg-purple-50 text-purple-600 rounded-xl"><i class="fa-solid fa-terminal"></i></div>
                        <div><h2 class="text-lg font-bold text-slate-800">Prompt Engineering Studio</h2><p class="text-xs text-slate-500">AI tool to optimize your raw prompts.</p></div>
                    </div>
                    <textarea id="raw-prompt" rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-800 focus:outline-none focus:border-purple-500 mb-3" placeholder="Enter raw idea here..."></textarea>
                    <button onclick="runAITool('prompt')" class="px-5 py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-xl text-xs transition shadow">Optimize Prompt via AI</button>
                    <div id="module-res" class="hidden mt-3 p-3 bg-purple-50 rounded-xl border border-purple-100 text-xs text-purple-900 whitespace-pre-line"></div>
                `;
            } else if(mod === 'content') {
                container.innerHTML = `
                    <div class="flex items-center space-x-3 mb-3">
                        <div class="p-2.5 bg-indigo-50 text-indigo-600 rounded-xl"><i class="fa-solid fa-pen-nib"></i></div>
                        <div><h2 class="text-lg font-bold text-slate-800">Content & Blog Creator</h2><p class="text-xs text-slate-500">Generate real articles & copywriting.</p></div>
                    </div>
                    <input type="text" id="module-input-val" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-800 focus:outline-none focus:border-indigo-500 mb-3" placeholder="Enter Topic / Niche...">
                    <button onclick="runAITool('content')" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs transition shadow">Generate Real Content</button>
                    <div id="module-res" class="hidden mt-3 p-3 bg-indigo-50 rounded-xl border border-indigo-100 text-xs text-slate-700 whitespace-pre-line max-h-48 overflow-y-auto"></div>
                `;
            } else if(mod === 'video') {
                container.innerHTML = `
                    <div class="flex items-center space-x-3 mb-3">
                        <div class="p-2.5 bg-pink-50 text-pink-600 rounded-xl"><i class="fa-solid fa-video"></i></div>
                        <div><h2 class="text-lg font-bold text-slate-800">Video & Reels Generator</h2><p class="text-xs text-slate-500">Create viral AI scripts & video timelines.</p></div>
                    </div>
                    <textarea id="module-input-val" rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-800 focus:outline-none focus:border-pink-500 mb-3" placeholder="Describe your video/reel concept..."></textarea>
                    <button onclick="runAITool('video')" class="px-5 py-2.5 bg-pink-600 hover:bg-pink-700 text-white font-semibold rounded-xl text-xs transition shadow">Generate Reel Script</button>
                    <div id="module-res" class="hidden mt-3 p-3 bg-pink-50 rounded-xl border border-pink-100 text-xs text-slate-700 whitespace-pre-line max-h-48 overflow-y-auto"></div>
                `;
            } else {
                container.innerHTML = `
                    <div class="flex items-center space-x-3 mb-3">
                        <div class="p-2.5 bg-blue-50 text-blue-600 rounded-xl"><i class="fa-solid fa-sparkles"></i></div>
                        <div><h2 class="text-lg font-bold text-slate-800">${mod.toUpperCase()} Suite Active</h2><p class="text-xs text-slate-500">AI automated intelligence tools ready.</p></div>
                    </div>
                    <input type="text" id="module-input-val" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-800 focus:outline-none focus:border-blue-500 mb-3" placeholder="What do you want to achieve in ${mod}?">
                    <button onclick="runAITool('${mod}')" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-xs transition shadow">Execute AI Task</button>
                    <div id="module-res" class="hidden mt-3 p-3 bg-blue-50 rounded-xl border border-blue-100 text-xs text-slate-700 whitespace-pre-line max-h-48 overflow-y-auto"></div>
                `;
            }
        }

        function showStatus(msg) {
            const el = document.getElementById('status-alert');
            el.innerText = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        }

        // Real AI API Call Function
        async function callGeminiAPI(promptText) {
            if(!API_KEY || API_KEY === "YOUR_GEMINI_API_KEY_HERE") {
                return "⚠️ Please add your Gemini API key in the JavaScript code section to get live AI responses.";
            }
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });
                const data = await response.json();
                if(data.candidates && data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    return "Sorry, could not generate a response right now.";
                }
            } catch (err) {
                return "Error connecting to AI server. Please check your network or API key.";
            }
        }

        async function sendUserPrompt() {
            const input = document.getElementById('main-input');
            const val = input.value.trim();
            if(!val) return;

            if(currentModule === 'chat') {
                document.getElementById('welcome-banner').classList.add('hidden');
                const chatBox = document.getElementById('chat-messages');
                chatBox.classList.remove('hidden');

                // Append User Message
                chatBox.innerHTML += `
                    <div class="flex items-start space-x-3 bg-slate-50 p-3.5 rounded-2xl border border-slate-200 text-xs md:text-sm">
                        <div class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center font-bold text-white text-[10px]">You</div>
                        <div class="text-slate-700 mt-0.5">${val}</div>
                    </div>
                    <div id="loading-resp" class="flex items-start space-x-3 bg-blue-50/60 p-3.5 rounded-2xl border border-blue-100 text-xs md:text-sm">
                        <div class="w-6 h-6 rounded-full bg-gradient-to-r from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white text-[10px]"><i class="fa-solid fa-sparkles"></i></div>
                        <div class="text-slate-700 mt-0.5 animate-pulse">OmniSpark AI is thinking...</div>
                    </div>
                `;
                input.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;

                // Fetch Real AI Response
                const aiAnswer = await callGeminiAPI(val);
                
                // Remove loading and show response
                document.getElementById('loading-resp').remove();
                chatBox.innerHTML += `
                    <div class="flex items-start space-x-3 bg-blue-50/60 p-3.5 rounded-2xl border border-blue-100 text-xs md:text-sm">
                        <div class="w-6 h-6 rounded-full bg-gradient-to-r from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white text-[10px]"><i class="fa-solid fa-sparkles"></i></div>
                        <div class="text-slate-700 mt-0.5 whitespace-pre-line">${aiAnswer}</div>
                    </div>
                `;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        async function runAITool(mode) {
            let inputField = mode === 'prompt' ? document.getElementById('raw-prompt') : document.getElementById('module-input-val');
            const textVal = inputField ? inputField.value.trim() : '';
            if(!textVal) return;

            const resDiv = document.getElementById('module-res');
            resDiv.classList.remove('hidden');
            resDiv.innerText = "Generating AI response...";

            let queryPrompt = textVal;
            if(mode === 'prompt') queryPrompt = `Optimize this prompt for an advanced AI model: ${textVal}`;
            if(mode === 'content') queryPrompt = `Write a detailed, high-quality blog post or content piece about: ${textVal}`;
            if(mode === 'video') queryPrompt = `Create a viral social media video/reel script with hooks and scenes for: ${textVal}`;

            const result = await callGeminiAPI(queryPrompt);
            resDiv.innerText = result;
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if(file) {
                showStatus(`File attached: ${file.name}. Ready for analysis.`);
            }
        }

        function triggerMic() {
            showStatus('Voice listening simulated. Speak into your device.');
        }
    </script>
</body>
</html>
