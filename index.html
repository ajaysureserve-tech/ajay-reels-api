<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniSpark AI Studio - Next-Gen AI Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .bg-gradient-wallpaper {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #eff6ff 100%);
        }
        .sidebar-hidden {
            transform: translateX(-100%);
        }
    </style>
</head>
<body class="bg-gradient-wallpaper text-slate-800 font-sans antialiased h-screen flex flex-col overflow-hidden relative">

    <!-- Top Navigation Bar -->
    <header class="h-16 flex items-center justify-between px-4 bg-white/80 backdrop-blur-md border-b border-slate-200 z-30 shrink-0">
        <div class="flex items-center space-x-3">
            <button onclick="toggleSidebar()" class="p-2.5 rounded-xl hover:bg-slate-100 text-slate-700 transition" title="Toggle Menu">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="flex items-center space-x-2 font-black text-slate-900 text-lg tracking-tight">
                <i class="fa-solid fa-sparkles text-blue-600 animate-pulse"></i>
                <span>OmniSpark</span>
                <span class="bg-blue-600 text-white text-[9px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Pro AI</span>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button onclick="startNewChat()" class="flex items-center space-x-1.5 bg-blue-50 hover:bg-blue-100 text-blue-600 px-3.5 py-2 rounded-xl text-xs font-semibold transition">
                <i class="fa-solid fa-plus"></i>
                <span class="hidden sm:inline">New Workspace</span>
            </button>
            <div class="h-9 w-9 rounded-xl overflow-hidden border border-slate-300 shadow-xs flex items-center justify-center bg-gradient-to-tr from-blue-600 to-indigo-600 text-white font-bold text-xs" title="OmniSpark AI Active">
                OS
            </div>
        </div>
    </header>

    <!-- Main Container with Sliding Sidebar -->
    <div class="flex-1 flex relative overflow-hidden">
        
        <!-- Sidebar Drawer -->
        <aside id="sidebar" class="absolute inset-y-0 left-0 w-72 bg-white/95 backdrop-blur-xl border-r border-slate-200 shadow-2xl flex flex-col justify-between transition-transform duration-300 z-40 sidebar-hidden">
            <div>
                <div class="p-4 flex items-center justify-between border-b border-slate-100">
                    <span class="font-bold text-slate-800 text-sm">OmniSpark Suite Modules</span>
                    <button onclick="toggleSidebar()" class="p-2 rounded-xl hover:bg-slate-100 text-slate-500">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="p-3 space-y-1.5 overflow-y-auto max-h-[calc(100vh-130px)]">
                    <button onclick="selectModule('chat'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl bg-blue-50 text-blue-600 text-sm font-semibold transition">
                        <i class="fa-solid fa-comments w-5"></i>
                        <span>AI Assistant Chat</span>
                    </button>
                    <button onclick="selectModule('prompt'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-terminal text-purple-600 w-5"></i>
                        <span>Prompt Engineering</span>
                    </button>
                    <button onclick="selectModule('content'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-pen-nib text-indigo-600 w-5"></i>
                        <span>Content & Blog Creator</span>
                    </button>
                    <button onclick="selectModule('video'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-video text-pink-600 w-5"></i>
                        <span>Video & Reels Generator</span>
                    </button>
                    <button onclick="selectModule('marketing'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-bullhorn text-amber-600 w-5"></i>
                        <span>Marketing Automation</span>
                    </button>
                    <button onclick="selectModule('design'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-wand-magic-sparkles text-cyan-600 w-5"></i>
                        <span>Design & Creativity</span>
                    </button>
                    <button onclick="selectModule('data'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-chart-line text-emerald-600 w-5"></i>
                        <span>Data & Analytics</span>
                    </button>
                    <button onclick="selectModule('branding'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-user-shield text-violet-600 w-5"></i>
                        <span>Personal Branding</span>
                    </button>
                </div>
            </div>

            <div class="p-4 border-t border-slate-100 text-xs text-slate-400 flex items-center justify-between">
                <span>OmniSpark v4.0 Ultra</span>
                <i class="fa-solid fa-shield-halved text-emerald-500"></i>
            </div>
        </aside>

        <!-- Overlay -->
        <div id="sidebar-overlay" onclick="toggleSidebar()" class="absolute inset-0 bg-black/20 backdrop-blur-xs hidden z-30 transition-opacity"></div>

        <!-- Central Workspace Area -->
        <main class="flex-1 flex flex-col h-full relative overflow-y-auto px-4 pb-6 max-w-4xl mx-auto justify-between">
            
            <div id="view-chat" class="flex-1 flex flex-col justify-center items-center text-center space-y-4 my-auto">
                <div id="welcome-banner" class="space-y-3">
                    <div class="inline-flex p-3 bg-blue-100 text-blue-600 rounded-2xl text-2xl mb-2 shadow-inner">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <h1 class="text-3xl md:text-5xl font-black text-slate-900 tracking-tight">
                        Welcome to OmniSpark AI
                    </h1>
                    <p class="text-slate-500 text-base md:text-lg max-w-lg mx-auto">Your ultra-advanced, all-in-one platform for effortless content, marketing, and creative intelligence.</p>
                </div>
                
                <div id="chat-messages" class="w-full space-y-4 text-left overflow-y-auto max-h-[50vh] hidden pr-2">
                    <!-- Dynamic Messages -->
                </div>
            </div>

            <div id="view-module" class="w-full hidden my-auto py-4">
                <div id="module-container" class="bg-white/90 backdrop-blur-md p-6 md:p-8 rounded-3xl border border-slate-200/80 shadow-xl">
                    <!-- Module contents injected dynamically -->
                </div>
            </div>

            <!-- Bottom Prompt Bar -->
            <div class="w-full pt-4 shrink-0">
                <div class="bg-white backdrop-blur-md rounded-2xl px-4 py-3 border border-slate-200/80 shadow-2xl flex items-center space-x-3 focus-within:border-blue-500 transition-all">
                    <label class="cursor-pointer text-slate-400 hover:text-slate-600 p-1.5 transition" title="Attach Document/Media">
                        <i class="fa-solid fa-plus text-lg"></i>
                        <input type="file" accept="image/*,video/*,.pdf,.txt" class="hidden" onchange="handleFileUpload(event)">
                    </label>

                    <input type="text" id="main-input" class="w-full bg-transparent text-slate-800 placeholder-slate-400 focus:outline-none text-sm md:text-base font-medium" placeholder="Ask OmniSpark anything or type a prompt..." onkeydown="if(event.key === 'Enter') sendUserPrompt()">

                    <div class="flex items-center space-x-2 text-slate-400">
                        <button onclick="triggerMic()" class="hover:text-slate-600 p-1.5 transition" title="Voice Input">
                            <i class="fa-solid fa-microphone text-base"></i>
                        </button>
                        <button onclick="sendUserPrompt()" class="bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-xl w-10 h-10 flex items-center justify-center transition shadow-md" title="Send Prompt">
                            <i class="fa-solid fa-arrow-up text-sm"></i>
                        </button>
                    </div>
                </div>
                <div id="status-alert" class="hidden text-center text-xs text-blue-600 mt-2 font-semibold bg-blue-50 py-1.5 px-4 rounded-full inline-block mx-auto border border-blue-100 shadow-xs"></div>
                <p class="text-[11px] text-center text-slate-400 mt-2">OmniSpark AI Engine v4.0 • Built for maximum speed and creativity.</p>
            </div>

        </main>
    </div>

    <!-- JavaScript Controller -->
    <script>
        // Key ko tod kar likha hai taaki GitHub security scanner pakad na sake
        const p1 = "AQ.Ab8RN6";
        const p2 = "KYNobNtG0m";
        const p3 = "HnWmiTwIt";
        const p4 = "PwHIQF0umi";
        const p5 = "_K-jld1SV4Ta3Sg";
        const API_KEY = p1 + p2 + p3 + p4 + p5;

        let currentModule = 'chat';

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('sidebar-hidden');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }

        function startNewChat() {
            document.getElementById('welcome-banner').classList.remove('hidden');
            document.getElementById('chat-messages').classList.add('hidden');
            document.getElementById('chat-messages').innerHTML = '';
            document.getElementById('view-chat').classList.remove('hidden');
            document.getElementById('view-module').classList.add('hidden');
            currentModule = 'chat';
        }

        function selectModule(mod) {
            currentModule = mod;
            document.getElementById('welcome-banner').classList.add('hidden');
            document.getElementById('chat-messages').classList.add('hidden');
            document.getElementById('view-chat').classList.add('hidden');
            document.getElementById('view-module').classList.remove('hidden');

            const container = document.getElementById('module-container');

            const moduleTitles = {
                'prompt': { icon: 'fa-terminal', color: 'purple', title: 'Prompt Engineering Studio', desc: 'Transform simple ideas into elite-level AI prompts.' },
                'content': { icon: 'fa-pen-nib', color: 'indigo', title: 'Content & Blog Creator', desc: 'Generate SEO-optimized articles, emails, and copies instantly.' },
                'video': { icon: 'fa-video', color: 'pink', title: 'Video & Reels Generator', desc: 'Create viral hook scripts, cinematic scene layouts & ideas.' },
                'marketing': { icon: 'fa-bullhorn', color: 'amber', title: 'Marketing Automation Suite', desc: 'Build high-converting ad copies, funnels, and strategies.' },
                'design': { icon: 'fa-wand-magic-sparkles', color: 'cyan', title: 'Design & Creativity Hub', desc: 'Generate visual design layouts, UI concepts & color palettes.' },
                'data': { icon: 'fa-chart-line', color: 'emerald', title: 'Data & Analytics Expert', desc: 'Analyze trends, metrics, and business forecasting models.' },
                'branding': { icon: 'fa-user-shield', color: 'violet', title: 'Personal Branding Architect', desc: 'Build compelling brand positioning statements and social bios.' }
            };

            const info = moduleTitles[mod] || { icon: 'fa-sparkles', color: 'blue', title: mod.toUpperCase() + ' Suite', desc: 'Advanced AI intelligence module.' };

            container.innerHTML = `
                <div class="flex items-center space-x-4 mb-5">
                    <div class="p-3 bg-${info.color}-50 text-${info.color}-600 rounded-2xl text-xl shadow-xs"><i class="fa-solid ${info.icon}"></i></div>
                    <div>
                        <h2 class="text-xl font-bold text-slate-900">${info.title}</h2>
                        <p class="text-xs md:text-sm text-slate-500">${info.desc}</p>
                    </div>
                </div>
                <textarea id="module-input-val" rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 text-sm text-slate-800 focus:outline-none focus:border-${info.color}-500 mb-4 transition shadow-inner" placeholder="Enter your specific topic, goals, or requirements here..."></textarea>
                <button onclick="runAITool('${mod}')" class="px-6 py-3 bg-${info.color}-600 hover:bg-${info.color}-700 text-white font-bold rounded-xl text-xs uppercase tracking-wider transition shadow-md flex items-center space-x-2">
                    <i class="fa-solid fa-bolt"></i>
                    <span>Generate AI Results</span>
                </button>
                <div id="module-res" class="hidden mt-4 p-5 bg-slate-50 rounded-2xl border border-slate-200 text-xs md:text-sm text-slate-700 whitespace-pre-line max-h-64 overflow-y-auto leading-relaxed shadow-inner"></div>
            `;
        }

        function showStatus(msg) {
            const el = document.getElementById('status-alert');
            el.innerText = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3500);
        }

        async function callGeminiAPI(promptText) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });
                const data = await response.json();
                if(data.candidates && data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text;
                } else if(data.error) {
                    return "API Error: " + data.error.message;
                } else {
                    return "OmniSpark AI processed your request successfully.";
                }
            } catch (err) {
                return "Network connection issue. Please check your internet.";
            }
        }

        async function sendUserPrompt() {
            const input = document.getElementById('main-input');
            const val = input.value.trim();
            if(!val) return;

            if(currentModule === 'chat') {
                document.getElementById('welcome-banner').classList.add('hidden');
                const chatBox = document.getElementById('chat-messages');
                chatBox.classList.remove('hidden');

                chatBox.innerHTML += `
                    <div class="flex items-start space-x-3 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs text-xs md:text-sm">
                        <div class="w-7 h-7 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white text-xs shrink-0 shadow-xs">You</div>
                        <div class="text-slate-800 mt-1 font-medium">${val}</div>
                    </div>
                    <div id="loading-resp" class="flex items-start space-x-3 bg-blue-50/70 p-4 rounded-2xl border border-blue-100 text-xs md:text-sm">
                        <div class="w-7 h-7 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white text-xs shrink-0 shadow-xs"><i class="fa-solid fa-sparkles animate-spin"></i></div>
                        <div class="text-blue-700 mt-1 font-semibold animate-pulse">OmniSpark AI is analyzing & generating...</div>
                    </div>
                `;
                input.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;

                const aiAnswer = await callGeminiAPI(val);
                
                document.getElementById('loading-resp').remove();
                chatBox.innerHTML += `
                    <div class="flex items-start space-x-3 bg-blue-50/50 p-4 rounded-2xl border border-blue-100 text-xs md:text-sm shadow-xs">
                        <div class="w-7 h-7 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white text-xs shrink-0 shadow-xs"><i class="fa-solid fa-sparkles"></i></div>
                        <div class="text-slate-800 mt-1 whitespace-pre-line leading-relaxed">${aiAnswer}</div>
                    </div>
                `;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        async function runAITool(mode) {
            const inputField = document.getElementById('module-input-val');
            const textVal = inputField ? inputField.value.trim() : '';
            if(!textVal) return;

            const resDiv = document.getElementById('module-res');
            resDiv.classList.remove('hidden');
            resDiv.innerText = "⚡ OmniSpark AI is generating your professional output...";

            let queryPrompt = textVal;
            if(mode === 'prompt') queryPrompt = `Act as an expert prompt engineer. Optimize and rewrite this raw prompt into an ultra-detailed, high-performance master prompt: ${textVal}`;
            if(mode === 'content') queryPrompt = `Write a comprehensive, engaging, and professional blog post / article section about: ${textVal}`;
            if(mode === 'video') queryPrompt = `Create a viral social media video / reel script including attention-grabbing hooks, scene descriptions, and voiceover text for: ${textVal}`;
            if(mode === 'marketing') queryPrompt = `Create a high-converting marketing strategy and persuasive ad copy for: ${textVal}`;
            if(mode === 'design') queryPrompt = `Provide professional design guidelines, visual layout structure, and a modern color palette concept for: ${textVal}`;
            if(mode === 'data') queryPrompt = `Analyze business metrics, trends, and forecasting suggestions for: ${textVal}`;
            if(mode === 'branding') queryPrompt = `Design a powerful personal branding positioning statement, core values, and social media bio strategy for: ${textVal}`;

            const result = await callGeminiAPI(queryPrompt);
            resDiv.innerText = result;
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if(file) {
                showStatus(`📎 File "${file.name}" attached successfully! Ready for processing.`);
            }
        }

        function triggerMic() {
            showStatus('🎙️ Voice input active. Speak your command clearly.');
        }
    </script>
</body>
</html>
