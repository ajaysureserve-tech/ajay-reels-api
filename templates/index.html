<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Mobile Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #0f172a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .phone-frame {
            width: 100%;
            max-width: 414px;
            height: 100%;
            max-height: 896px;
            background: #000;
            border-radius: 0px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        @media (min-width: 480px) {
            .phone-frame {
                height: 90vh;
                border-radius: 40px;
                border: 10px solid #2d3748;
            }
        }
        .status-bar {
            height: 40px;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            z-index: 10;
        }
        .home-screen {
            flex: 1;
            background: linear-gradient(135deg, #4338ca, #6d28d9, #0284c7);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px 15px;
        }
        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .app-icon:active {
            transform: scale(0.92);
        }
        .icon-box {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            color: #fff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            margin-bottom: 6px;
        }
        .app-name {
            color: #fff;
            font-size: 12px;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        .dock {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Status Bar -->
        <div class="status-bar">
            <span id="clock">15:50</span>
            <span>5G 🔋</span>
        </div>

        <!-- Home Screen -->
        <div class="home-screen" id="homeScreen">
            <div class="app-grid">
                <!-- YouTube -->
                <a class="app-icon" href="https://m.youtube.com" target="_blank">
                    <div class="icon-box" style="background: #ff0000;">▶</div>
                    <span class="app-name">YouTube</span>
                </a>
                <!-- Amazon -->
                <a class="app-icon" href="https://www.amazon.in" target="_blank">
                    <div class="icon-box" style="background: #ff9900;">🛒</div>
                    <span class="app-name">Amazon</span>
                </a>
                <!-- Flipkart -->
                <a class="app-icon" href="https://www.flipkart.com" target="_blank">
                    <div class="icon-box" style="background: #2874f0;">🛍️</div>
                    <span class="app-name">Flipkart</span>
                </a>
                <!-- Instagram -->
                <a class="app-icon" href="https://www.instagram.com" target="_blank">
                    <div class="icon-box" style="background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);">📸</div>
                    <span class="app-name">Instagram</span>
                </a>
                <!-- Google -->
                <a class="app-icon" href="https://www.google.com" target="_blank">
                    <div class="icon-box" style="background: #ffffff; color: #4285F4;">G</div>
                    <span class="app-name">Google</span>
                </a>
                <!-- Wikipedia -->
                <a class="app-icon" href="https://www.wikipedia.org" target="_blank">
                    <div class="icon-box" style="background: #f8f9fa; color: #000;">W</div>
                    <span class="app-name">Wikipedia</span>
                </a>
                <!-- Calculator -->
                <a class="app-icon" href="https://www.online-calculator.com/full-screen-calculator.php" target="_blank">
                    <div class="icon-box" style="background: #334155;">🔢</div>
                    <span class="app-name">Calculator</span>
                </a>
                <!-- Weather -->
                <a class="app-icon" href="https://weather.com" target="_blank">
                    <div class="icon-box" style="background: #0ea5e9;">🌤️</div>
                    <span class="app-name">Weather</span>
                </a>
            </div>

            <!-- Dock at bottom -->
            <div class="dock">
                <a class="app-icon" href="https://www.google.com" target="_blank">
                    <div class="icon-box" style="background: #22c55e; width: 50px; height: 50px; font-size: 20px;">📞</div>
                </a>
                <a class="app-icon" href="https://www.google.com" target="_blank">
                    <div class="icon-box" style="background: #3b82f6; width: 50px; height: 50px; font-size: 20px;">🌐</div>
                </a>
                <a class="app-icon" href="https://www.google.com" target="_blank">
                    <div class="icon-box" style="background: #64748b; width: 50px; height: 50px; font-size: 20px;">📷</div>
                </a>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
