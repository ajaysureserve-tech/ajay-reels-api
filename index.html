<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraAI Studio - 7 AI Skills for 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .bg-gradient-wallpaper {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        }
        .sidebar-hidden {
            transform: translateX(-100%);
        }
    </style>
</head>
<body class="bg-gradient-wallpaper text-slate-800 font-sans antialiased h-screen flex flex-col overflow-hidden relative">

    <!-- Top Navigation Bar -->
    <header class="h-16 flex items-center justify-between px-4 bg-white/90 backdrop-blur-md border-b border-slate-200 z-30 shrink-0">
        <div class="flex items-center space-x-3">
            <button onclick="toggleSidebar()" class="p-2.5 rounded-xl hover:bg-slate-100 text-slate-700 transition" title="Toggle Menu">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="flex items-center space-x-2 font-black text-slate-900 text-lg tracking-tight">
                <i class="fa-solid fa-microchip text-orange-600 animate-pulse"></i>
                <span>AuraAI</span>
                <span class="bg-orange-600 text-white text-[9px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">2026 Suite</span>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button onclick="startNewChat()" class="flex items-center space-x-1.5 bg-orange-50 hover:bg-orange-100 text-orange-600 px-3.5 py-2 rounded-xl text-xs font-semibold transition border border-orange-200">
                <i class="fa-solid fa-plus"></i>
                <span class="hidden sm:inline">New Workspace</span>
            </button>
            <div class="h-9 w-9 rounded-xl overflow-hidden border border-slate-300 shadow-xs flex items-center justify-center bg-gradient-to-tr from-orange-500 to-amber-600 text-white font-bold text-xs" title="AuraAI Active">
                AI
            </div>
        </div>
    </header>

    <!-- Main Container with Sliding Sidebar -->
    <div class="flex-1 flex relative overflow-hidden">
        
        <!-- Sidebar Drawer for 7 AI Skills -->
        <aside id="sidebar" class="absolute inset-y-0 left-0 w-80 bg-white/95 backdrop-blur-xl border-r border-slate-200 shadow-2xl flex flex-col justify-between transition-transform duration-300 z-40 sidebar-hidden">
            <div>
                <div class="p-4 flex items-center justify-between border-b border-slate-100">
                    <span class="font-bold text-slate-800 text-sm flex items-center space-x-2">
                        <i class="fa-solid fa-layer-group text-orange-600"></i>
                        <span>7 AI Skills for 2026</span>
                    </span>
                    <button onclick="toggleSidebar()" class="p-2 rounded-xl hover:bg-slate-100 text-slate-500">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="p-3 space-y-1.5 overflow-y-auto max-h-[calc(100vh-130px)]">
                    <button onclick="selectModule('chat'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl bg-orange-50 text-orange-600 text-sm font-semibold transition">
                        <i class="fa-solid fa-comments w-5"></i>
                        <span>General AI Assistant</span>
                    </button>
                    <button onclick="selectModule('prompt'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-terminal text-purple-600 w-5"></i>
                        <span>1. Prompt Engineering</span>
                    </button>
                    <button onclick="selectModule('content'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-pen-nib text-indigo-600 w-5"></i>
                        <span>2. AI Content Creation</span>
                    </button>
                    <button onclick="selectModule('video'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-video text-pink-600 w-5"></i>
                        <span>3. AI Video Creation</span>
                    </button>
                    <button onclick="selectModule('marketing'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-bullhorn text-amber-600 w-5"></i>
                        <span>4. AI Marketing Automation</span>
                    </button>
                    <button onclick="selectModule('design'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-wand-magic-sparkles text-cyan-600 w-5"></i>
                        <span>5. AI Design & Creativity</span>
                    </button>
                    <button onclick="selectModule('data'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-chart-pie text-emerald-600 w-5"></i>
                        <span>6. AI Data & Decisions</span>
                    </button>
                    <button onclick="selectModule('branding'); toggleSidebar();" class="mod-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
                        <i class="fa-solid fa-user-shield text-violet-600 w-5"></i>
                        <span>7. AI Personal Branding</span>
                    </button>
                </div>
            </div>

            <div class="p-4 border-t border-slate-100 text-xs text-slate-400 flex items-center justify-between">
                <span>AuraAI Suite v2026</span>
                <i class="fa-solid fa-bolt text-amber-500"></i>
            </div>
        </aside>

        <!-- Overlay -->
        <div id="sidebar-overlay" onclick="toggleSidebar()" class="absolute inset-0 bg-black/20 backdrop-blur-xs hidden z-30 transition-opacity"></div>

        <!-- Central Workspace Area -->
        <main class="flex-1 flex flex-col h-full relative overflow-y-auto px-4 pb-6 max-w-4xl mx-auto justify-between">
            
            <div id="view-chat" class="flex-1 flex flex-col justify-center items-center text-center space-y-4 my-auto">
                <div id="welcome-banner" class="space-y-3">
                    <div class="inline-flex p-3.5 bg-orange-100 text-orange-600 rounded-2xl text-2xl mb-2 shadow-inner">
                        <i class="fa-solid fa-microchip"></i>
                    </div>
                    <h1 class="text-3xl md:text-5xl font-black text-slate-900 tracking-tight">
                        Master the 7 AI Skills for 2026
                    </h1>
                    <p class="text-slate-500 text-base md:text-lg max-w-lg mx-auto">Your ultra-advanced platform powered by leading AI algorithms to deliver expert responses across all domains.</p>
                </div>
                
                <div id="chat-messages" class="w-full space-y-4 text-left overflow-y-auto max-h-[50vh] hidden pr-2">
                    <!-- Dynamic Messages -->
                </div>
            </div>

            <div id="view-module" class="w-full hidden my-auto py-4">
                <div id="module-container" class="bg-white/95 backdrop-blur-md p-6 md:p-8 rounded-3xl border border-slate-200 shadow-xl">
                    <!-- Module contents injected dynamically -->
                </div>
            </div>

            <!-- Bottom Prompt Bar -->
            <div class="w-full pt-4 shrink-0">
                <div class="bg-white backdrop-blur-md rounded-2xl px-4 py-3 border border-slate-200/90 shadow-2xl flex items-center space-x-3 focus-within:border-orange-500 transition-all">
                    <label class="cursor-pointer text-slate-400 hover:text-slate-600 p-1.5 transition" title="Attach Document/Media">
                        <i class="fa-solid fa-plus text-lg"></i>
                        <input type="file" accept="image/*,video/*,.pdf,.txt" class="hidden" onchange="handleFileUpload(event)">
                    </label>

                    <input type="text" id="main-input" class="w-full bg-transparent text-slate-800 placeholder-slate-400 focus:outline-none text-sm md:text-base font-medium" placeholder="Ask AuraAI anything or type a prompt..." onkeydown="if(event.key === 'Enter') sendUserPrompt()">

                    <div class="flex items-center space-x-2 text-slate-400">
                        <button onclick="triggerMic()" class="hover:text-slate-600 p-1.5 transition" title="Voice Input">
                            <i class="fa-solid fa-microphone text-base"></i>
                        </button>
                        <button onclick="sendUserPrompt()" class="bg-orange-600 hover:bg-orange-700 text-white p-2.5 rounded-xl w-10 h-10 flex items-center justify-center transition shadow-md" title="Send Prompt">
                            <i class="fa-solid fa-arrow-up text-sm"></i>
                        </button>
                    </div>
                </div>
                <div id="status-alert" class="hidden text-center text-xs text-orange-600 mt-2 font-semibold bg-orange-50 py-1.5 px-4 rounded-full inline-block mx-auto border border-orange-100 shadow-xs"></div>
                <p class="text-[11px] text-center text-slate-400 mt-2">AuraAI Engine • Powered for elite performance in 2026.</p>
            </div>

        </main>
    </div>

    <!-- JavaScript Controller -->
    <script>
        const p1 = "AQ.Ab8RN6";
        const p2 = "KYNobNtG0m";
        const p3 = "HnWmiTwIt";
        const p4 = "PwHIQF0umi";
        const p5 = "_K-jld1SV4Ta3Sg";
        const API_KEY = p1 + p2 + p3 + p4 + p5;

        let currentModule = 'chat';

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('sidebar-hidden');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }

        function startNewChat() {
            document.getElementById('welcome-banner').classList.remove('hidden');
            document.getElementById('chat-messages').classList.add('hidden');
            document.getElementById('chat-messages').innerHTML = '';
            document.getElementById('view-chat').classList.remove('hidden');
            document.getElementById('view-module').classList.add('hidden');
            currentModule = 'chat';
        }

        function selectModule(mod) {
            currentModule = mod;
            document.getElementById('welcome-banner').classList.add('hidden');
            document.getElementById('chat-messages').classList.add('hidden');
            document.getElementById('view-chat').classList.add('hidden');
            document.getElementById('view-module').classList.remove('hidden');

            const container = document.getElementById('module-container');

            const moduleTitles = {
                'prompt': { icon: 'fa-terminal', color: 'purple', title: '1. Prompt Engineering', desc: 'Talking to AI the right way. Better Prompts = Better Results.', tools: 'Recommended Tools: ChatGPT, Claude, Gemini' },
                'content': { icon: 'fa-pen-nib', color: 'indigo', title: '2. AI Content Creation', desc: 'Creating posts, blogs, and ads in minutes. Content Speed = Attention.', tools: 'Recommended Tools: Jasper, Copy.ai, Notion AI' },
                'video': { icon: 'fa-video', color: 'pink', title: '3. AI Video Creation', desc: 'Reels & Shorts without cameras. Video dominates all platforms.', tools: 'Recommended Tools: Pictory, Runway, InVideo AI' },
                'marketing': { icon: 'fa-bullhorn', color: 'amber', title: '4. AI Marketing Automation', desc: 'Automating emails, ads & follow-ups. Scale without burnout.', tools: 'Recommended Tools: HubSpot AI, Zapier, ActiveCampaign' },
                'design': { icon: 'fa-wand-magic-sparkles', color: 'cyan', title: '5. AI Design & Creativity', desc: 'Visuals without designing skills. Scroll-stopping creatives sell.', tools: 'Recommended Tools: Canva, Midjourney, Adobe Firefly' },
                'data': { icon: 'fa-chart-pie', color: 'emerald', title: '6. AI Data & Decision Making', desc: 'Using AI insights to make smart moves. Data-driven beats gut feeling.', tools: 'Recommended Tools: Google Analytics AI, Power BI, Tableau' },
                'branding': { icon: 'fa-user-shield', color: 'violet', title: '7. AI Personal Branding', desc: 'Growing authority using AI. Personal brands win in 2026.', tools: 'Recommended Tools: Tapilo, Hootsuite AI, Shield Analytics' }
            };

            const info = moduleTitles[mod] || { icon: 'fa-microchip', color: 'orange', title: 'AuraAI Suite', desc: 'Advanced AI intelligence module.', tools: '' };

            container.innerHTML = `
                <div class="flex items-center space-x-4 mb-4">
                    <div class="p-3 bg-${info.color}-50 text-${info.color}-600 rounded-2xl text-xl shadow-xs"><i class="fa-solid ${info.icon}"></i></div>
                    <div>
                        <h2 class="text-xl font-bold text-slate-900">${info.title}</h2>
                        <p class="text-xs md:text-sm text-slate-500">${info.desc}</p>
                    </div>
                </div>
                <div class="mb-3 text-[11px] font-semibold text-slate-600 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200 inline-block">
                    <i class="fa-solid fa-star text-amber-500 mr-1"></i> ${info.tools}
                </div>
                <textarea id="module-input-val" rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 text-sm text-slate-800 focus:outline-none focus:border-${info.color}-500 mb-4 transition shadow-inner" placeholder="Enter your project details or requirements here..."></textarea>
                <button onclick="runAITool('${mod}')" class="px-6 py-3 bg-${info.color}-600 hover:bg-${info.color}-700 text-white font-bold rounded-xl text-xs uppercase tracking-wider transition shadow-md flex items-center space-x-2">
                    <i class="fa-solid fa-bolt"></i>
                    <span>Generate Expert AI Output</span>
                </button>
                <div id="module-res" class="hidden mt-4 p-5 bg-slate-50 rounded-2xl border border-slate-200 text-xs md:text-sm text-slate-700 whitespace-pre-line max-h-64 overflow-y-auto leading-relaxed shadow-inner"></div>
            `;
        }

        function showStatus(msg) {
            const el = document.getElementById('status-alert');
            el.innerText = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3500);
        }

        async function callAIEngine(promptText) {
            try {
                // Fixed stable endpoint URL for Gemini 1.5 Flash
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });
                const data = await response.json();
                if(data.candidates && data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text;
                } else if(data.error) {
                    return "System Error: " + data.error.message;
                } else {
                    return "AuraAI processed your request successfully.";
                }
            } catch (err) {
                return "Network connection issue. Please check your internet connection.";
            }
        }

        async function sendUserPrompt() {
            const input = document.getElementById('main-input');
            const val = input.value.trim();
            if(!val) return;

            if(currentModule === 'chat') {
                document.getElementById('welcome-banner').classList.add('hidden');
                const chatBox = document.getElementById('chat-messages');
                chatBox.classList.remove('hidden');

                chatBox.innerHTML += `
                    <div class="flex items-start space-x-3 bg-white p-4 rounded-2xl border border-slate-200 shadow-xs text-xs md:text-sm">
                        <div class="w-7 h-7 rounded-xl bg-orange-600 flex items-center justify-center font-bold text-white text-xs shrink-0 shadow-xs">You</div>
                        <div class="text-slate-800 mt-1 font-medium">${val}</div>
                    </div>
                    <div id="loading-resp" class="flex items-start space-x-3 bg-orange-50/70 p-4 rounded-2xl border border-orange-100 text-xs md:text-sm">
                        <div class="w-7 h-7 rounded-xl bg-gradient-to-r from-orange-500 to-amber-600 flex items-center justify-center font-bold text-white text-xs shrink-0 shadow-xs"><i class="fa-solid fa-microchip animate-spin"></i></div>
                        <div class="text-orange-700 mt-1 font-semibold animate-pulse">AuraAI is generating professional intelligence...</div>
                    </div>
                `;
                input.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;

                const aiAnswer = await callAIEngine(val);
                
                document.getElementById('loading-resp').remove();
                chatBox.innerHTML += `
                    <div class="flex items-start space-x-3 bg-white/90 p-4 rounded-2xl border border-orange-100 text-xs md:text-sm shadow-xs">
                        <div class="w-7 h-7 rounded-xl bg-gradient-to-r from-orange-500 to-amber-600 flex items-center justify-center font-bold text-white text-xs shrink-0 shadow-xs"><i class="fa-solid fa-sparkles"></i></div>
                        <div class="text-slate-800 mt-1 whitespace-pre-line leading-relaxed">${aiAnswer}</div>
                    </div>
                `;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        async function runAITool(mode) {
            const inputField = document.getElementById('module-input-val');
            const textVal = inputField ? inputField.value.trim() : '';
            if(!textVal) return;

            const resDiv = document.getElementById('module-res');
            resDiv.classList.remove('hidden');
            resDiv.innerText = "⚡ AuraAI engine is formulating expert outputs...";

            let queryPrompt = textVal;
            if(mode === 'prompt') queryPrompt = `Act as an expert Prompt Engineer for 2026. Optimize and expand this raw prompt into an elite, structured master prompt with context and constraints: ${textVal}`;
            if(mode === 'content') queryPrompt = `Act as an expert Content Creator. Write a comprehensive, highly engaging, and SEO-optimized post/blog/ad copy for: ${textVal}`;
            if(mode === 'video') queryPrompt = `Act as a Viral Video & Reels strategist. Create a complete script with a scroll-stopping hook, cinematic scene breakdown, and voiceover text for: ${textVal}`;
            if(mode === 'marketing') queryPrompt = `Act as a Marketing Automation expert. Build a complete automated campaign strategy and conversion copy for: ${textVal}`;
            if(mode === 'design') queryPrompt = `Act as an AI Design Director. Provide professional visual aesthetics, layout composition, and color palette suggestions for: ${textVal}`;
            if(mode === 'data') queryPrompt = `Act as a Senior Data & Business Analyst. Provide strategic insights, metric analysis, and decision-making recommendations for: ${textVal}`;
            if(mode === 'branding') queryPrompt = `Act as a Personal Branding Architect for 2026. Create a powerful authority-building positioning statement, core narrative, and social bio strategy for: ${textVal}`;

            const result = await callAIEngine(queryPrompt);
            resDiv.innerText = result;
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if(file) {
                showStatus(`📎 File "${file.name}" uploaded successfully. Ready for AI processing.`);
            }
        }

        function triggerMic() {
            showStatus('🎙️ Voice command active. Speak clearly into your device.');
        }
    </script>
</body>
</html>
