<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 AI Skills for 2026 - Studio</title>
    <style>
        :root {
            --bg-color: #131314;
            --panel-color: #1e1f20;
            --text-color: #e3e3e3;
            --accent-color: #8ab4f8;
            --border-color: #333537;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--panel-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .skills-bar {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            background-color: #18191a;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
        }
        .skill-chip {
            background-color: var(--panel-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            color: var(--accent-color);
        }
        .skill-chip:hover {
            background-color: var(--accent-color);
            color: #000;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            padding: 12px 18px;
            border-radius: 12px;
            max-width: 75%;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-msg {
            background-color: #2b2c2f;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-msg {
            background-color: var(--panel-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid var(--border-color);
        }
        .input-area {
            padding: 20px;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
        }
        .input-wrapper {
            display: flex;
            width: 100%;
            max-width: 800px;
            background-color: var(--panel-color);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 8px 15px;
            align-items: center;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            padding: 8px;
        }
        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <span>7 AI Skills for 2026 Studio</span>
    </header>

    <div class="skills-bar">
        <div class="skill-chip" onclick="selectSkill('Prompt Engineering')">⚡ Prompt Engineering</div>
        <div class="skill-chip" onclick="selectSkill('AI Content Creation')">📝 Content Creation</div>
        <div class="skill-chip" onclick="selectSkill('AI Video Creation')">🎬 Video Creation</div>
        <div class="skill-chip" onclick="selectSkill('AI Marketing Automation')">📈 Marketing Automation</div>
        <div class="skill-chip" onclick="selectSkill('AI Design & Creativity')">🎨 Design & Creativity</div>
        <div class="skill-chip" onclick="selectSkill('AI Data & Decision Making')">📊 Data & Decision Making</div>
        <div class="skill-chip" onclick="selectSkill('AI Personal Branding')">🚀 Personal Branding</div>
    </div>

    <div id="chat-container">
        <div class="message ai-msg">Hello! 2026 ki 7 essential AI skills me se kisi bhi skill ke baare me poochhiye ya upar diye gaye chips par click kijiye!</div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="prompt-input" placeholder="Ask about AI skills or type prompt...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        // API Key split configuration for security protection
        const p1 = "AQ.Ab8RN6";
        const p2 = "KYNobNtG0m";
        const p3 = "HnWmiTwIt";
        const p4 = "PwHIQF0umi";
        const p5 = "_K-jld1SV4Ta3Sg";
        const GEMINI_API_KEY = p1 + p2 + p3 + p4 + p5;
        
        const chatContainer = document.getElementById('chat-container');
        const promptInput = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');

        function selectSkill(skillName) {
            promptInput.value = `Mujhe ${skillName} skill ke baare me detail me batao aur iske best tools suggest karo.`;
            handleUserSubmit();
        }

        async function callGeminiAPI(promptText) {
            // Updated to v1 and gemini-pro for stable API call execution
            const endpoint = `https://generativelanguage.googleapis.com/v1/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}`;
            
            const payload = {
                contents: [{ parts: [{ text: promptText }] }]
            };

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (data.candidates && data.candidates.length > 0) {
                    return data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    return `API Error: ${data.error.message}`;
                } else {
                    return "No response received.";
                }
            } catch (err) {
                return `Network Error: ${err.message}`;
            }
        }

        async function handleUserSubmit() {
            const text = promptInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user-msg');
            promptInput.value = '';

            const loadingId = appendMessage('Thinking...', 'ai-msg');
            const aiResponse = await callGeminiAPI(text);
            
            loadingId.innerText = aiResponse;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        sendBtn.addEventListener('click', handleUserSubmit);
        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleUserSubmit();
        });
    </script>
</body>
</html>
