<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Phone OS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #0f172a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        /* Phone Frame Container */
        .phone-frame {
            width: 100%;
            max-width: 414px;
            height: 100%;
            max-height: 896px;
            background: #000;
            border-radius: 0px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        @media (min-width: 480px) {
            .phone-frame {
                height: 90vh;
                border-radius: 40px;
                border: 10px solid #2d3748;
            }
        }
        /* Status Bar */
        .status-bar {
            height: 40px;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            z-index: 10;
        }
        /* Home Screen Launcher */
        .home-screen {
            flex: 1;
            background: linear-gradient(135deg, #4338ca, #6d28d9, #0284c7);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px 15px;
        }
        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .app-icon:active {
            transform: scale(0.92);
        }
        .icon-box {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            color: #fff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            margin-bottom: 6px;
        }
        .app-name {
            color: #fff;
            font-size: 12px;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        /* App View Window (Iframe container) */
        .app-window {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            z-index: 50;
            display: none;
            flex-direction: column;
        }
        .app-header {
            height: 50px;
            background: #1e293b;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #38bdf8;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .app-title {
            font-size: 16px;
            font-weight: 500;
        }
        .app-content {
            flex: 1;
            width: 100%;
            border: none;
        }
        /* Dock */
        .dock {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Status Bar -->
        <div class="status-bar">
            <span id="clock">15:35</span>
            <span>5G 🔋</span>
        </div>

        <!-- Home Screen -->
        <div class="home-screen" id="homeScreen">
            <div class="app-grid">
                <!-- YouTube -->
                <div class="app-icon" onclick="openApp('YouTube', 'https://m.youtube.com')">
                    <div class="icon-box" style="background: #ff0000;">▶</div>
                    <span class="app-name">YouTube</span>
                </div>
                <!-- Amazon -->
                <div class="app-icon" onclick="openApp('Amazon', 'https://www.amazon.in')">
                    <div class="icon-box" style="background: #ff9900;">🛒</div>
                    <span class="app-name">Amazon</span>
                </div>
                <!-- Flipkart -->
                <div class="app-icon" onclick="openApp('Flipkart', 'https://www.flipkart.com')">
                    <div class="icon-box" style="background: #2874f0;">🛍️</div>
                    <span class="app-name">Flipkart</span>
                </div>
                <!-- Instagram -->
                <div class="app-icon" onclick="openApp('Instagram', 'https://www.instagram.com')">
                    <div class="icon-box" style="background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);">📸</div>
                    <span class="app-name">Instagram</span>
                </div>
                <!-- Google -->
                <div class="app-icon" onclick="openApp('Google', 'https://www.google.com')">
                    <div class="icon-box" style="background: #ffffff; color: #4285F4;">G</div>
                    <span class="app-name">Google</span>
                </div>
                <!-- Wikipedia -->
                <div class="app-icon" onclick="openApp('Wikipedia', 'https://www.wikipedia.org')">
                    <div class="icon-box" style="background: #f8f9fa; color: #000;">W</div>
                    <span class="app-name">Wikipedia</span>
                </div>
                <!-- Calculator -->
                <div class="app-icon" onclick="openApp('Calculator', 'https://www.online-calculator.com/full-screen-calculator.php')">
                    <div class="icon-box" style="background: #334155;">🔢</div>
                    <span class="app-name">Calculator</span>
                </div>
                <!-- Weather -->
                <div class="app-icon" onclick="openApp('Weather', 'https://weather.com')">
                    <div class="icon-box" style="background: #0ea5e9;">🌤️</div>
                    <span class="app-name">Weather</span>
                </div>
            </div>

            <!-- Dock at bottom -->
            <div class="dock">
                <div class="app-icon" onclick="openApp('Phone', 'https://www.google.com')">
                    <div class="icon-box" style="background: #22c55e; width: 50px; height: 50px; font-size: 20px;">📞</div>
                </div>
                <div class="app-icon" onclick="openApp('Browser', 'https://www.google.com')">
                    <div class="icon-box" style="background: #3b82f6; width: 50px; height: 50px; font-size: 20px;">🌐</div>
                </div>
                <div class="app-icon" onclick="openApp('Camera', 'https://www.google.com')">
                    <div class="icon-box" style="background: #64748b; width: 50px; height: 50px; font-size: 20px;">📷</div>
                </div>
            </div>
        </div>

        <!-- Real App Window (Opens inside iframe) -->
        <div class="app-window" id="appWindow">
            <div class="app-header">
                <button class="back-btn" onclick="closeApp()">‹ Back</button>
                <span class="app-title" id="appWindowTitle">App</span>
                <span style="width: 40px;"></span>
            </div>
            <iframe class="app-content" id="appIframe" src=""></iframe>
        </div>
    </div>

    <script>
        // Real-time clock update
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Open App function
        function openApp(name, url) {
            document.getElementById('appWindowTitle').innerText = name;
            document.getElementById('appIframe').src = url;
            document.getElementById('appWindow').style.display = 'flex';
        }

        // Close App function
        function closeApp() {
            document.getElementById('appWindow').style.display = 'none';
            document.getElementById('appIframe').src = '';
        }
    </script>
</body>
</html>
